services:
  cognee_hybrid_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognee_hybrid_service
    restart: unless-stopped
    ports:
      # Published on loopback only: memory stays on this machine. To expose on
      # your LAN deliberately, change to "9480:9480"/"9481:9481" AND set
      # ONTOGRAM_TOKEN in .env (the MCP bridge then requires a bearer token).
      - "127.0.0.1:9480:9480" # REST API Backend & Swagger Docs & Knowledge Graph Visualizer
      - "127.0.0.1:9481:9481" # Memory MCP Server (streamable-http) -> http://localhost:9481/mcp
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - COGNEE_BACKEND_PORT=9480
      - COGNEE_MCP_PORT=9481
      - COGNEE_MCP_TRANSPORT=http
      - COGNEE_API_URL=http://localhost:9480
      # Inside the container we must bind 0.0.0.0: Docker's port publishing
      # forwards to the container's eth0, NOT its internal loopback. The
      # actual security boundary is the host-side "127.0.0.1:" prefix on the
      # port mappings above (plus ONTOGRAM_TOKEN when exposing beyond that).
      - COGNEE_BIND_HOST=0.0.0.0
      # Persist ALL Cognee storage on the named volume. Without these, Cognee
      # writes its databases inside the image (ephemeral) and every rebuild
      # wipes all memory.
      - DATA_ROOT_DIRECTORY=/root/.cognee/data_storage
      - SYSTEM_ROOT_DIRECTORY=/root/.cognee/cognee_system
      - CACHE_ROOT_DIRECTORY=/root/.cognee/cache
    volumes:
      - cognee_data:/root/.cognee
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9480/docs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  cognee_data:
    name: cognee_data
